# Gerenciado por server/infra/maquina/provisionar.sh. Nada de trust, md5 ou password.
# postgres (administracao local, so root via runuser) entra por peer; o resto, por senha scram.
local   all   postgres                      peer
local   all   all                           scram-sha-256
host    all   all        127.0.0.1/32       scram-sha-256
host    all   all        ::1/128            scram-sha-256
